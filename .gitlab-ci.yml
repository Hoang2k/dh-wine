stages:
    - build
    - deploy
    - checklog

build:
    stage: build
    variables:
        GIT_STRATEGY: clone
    before_script:
        - echo "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL" >> .env
        - echo "NEXTAUTH_SECRET=$NEXTAUTH_SECRET" >> .env
    script:
        - yarn install --frozen-lockfile
        - yarn build
    cache:
        paths:
         - node_modules/
    tags:
        - ntls-runner 
    only:
        - tags

deploy:
    stage: deploy
    variables:
        GIT_STRATEGY: none
    script:
        - sudo rsync -av --delete --exclude node_modules --exclude .git --exclude .env ./ /var/www/ntls/ntlsvx-frontend/
        - sudo chown -R ntls:ntls /var/www/ntls/ntlsvx-frontend
        - sudo -u ntls bash -c "cd /var/www/ntls/ntlsvx-frontend && yarn install --frozen-lockfile && pm2 restart ntlsvx-frontend || pm2 start npm --name "ntlsvx-frontend" -- run start"
    tags:
        - ntls-runner
    only:
        - tags


checklog:
    stage: checklog
    variables:
        GIT_STRATEGY: none
    script:
        - sudo -u ntls pm2 logs ntlsvx-frontend --lines 200 --nostream
    tags:
        - ntls-runner
    only:
        - tags

