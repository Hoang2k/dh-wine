stages:
    - build
    - deploy
    - checklog

build:
    stage: build
    variables:
        GIT_STRATEGY: clone
    before_script:
        - echo "NODE: $(which node)"
        - echo "YARN: $(which yarn)"
        - node -v
        - yarn -v
    script:
        - yarn install --frozen-lockfile
        - yarn build
    cache:
        paths:
         - node_modules/
    tags:
        - ntls-runner 
    only:
        - tags

deploy:
    stage: deploy
    variables:
        GIT_STRATEGY: none
    script:
        - >
                sudo rsync -av --delete --exclude node_modules --exclude .git --exclude .env ./ /var/www/ntls/ntlsvx-frontend/
                sudo chown -R ntls:ntls /var/www/ntls/ntlsvx-frontend
                sudo -u ntls bash -c "cd /var/www/ntls/ntlsvx-frontend && yarn install --frozen-lockfile && pm2 restart ntlsvx-frontend || pm2 start npm --name ntlsvx-frontend" -- start
    tags:
        - ntls-runner
    only:
        - tags


checklog:
    stage: checklog
    variables:
        GIT_STRATEGY: none
    script:
        - sudo -u ntls bash -c "cd /var/www/ntls/ntlsvx-frontend/ && tail -n 200 nohup.out"
    tags:
        - ntls-runner
    only:
        - tags

